id: resolve-notification-target
description: Resolve notify target channel/to/name/preference from phone or email (channels.json + user-onboarding when isUser)

packages: [nodejs]

env:
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  to:
    type: string
    required: true
  name:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /whatsapp/inbox:
    host: data/whatsapp_inbox
    mode: ro
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /data/mastermind:
    host: data/mastermind
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/knowledge-wiki:
    host: lib/knowledge-wiki
    mode: ro

run:
  entry: [node, /opt/nixery/def/run.mjs]

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
