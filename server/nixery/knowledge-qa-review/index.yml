id: knowledge-qa-review
description: Load topic corpus and run OpenAI checklist QA — no Cursor / worker hop

packages: [nodejs]

env:
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  OPENAI_BASE_URL: "https://api.deepseek.com"
  OPENAI_MODEL: deepseek-v4-pro
  OPENAI_API_KEY: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: true
  need:
    type: string
    required: false
  auditIssues:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /data/mastermind:
    host: data/mastermind
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/knowledge-wiki:
    host: lib/knowledge-wiki
    mode: ro

run:
  entry: [node, /opt/nixery/def/run.mjs]

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
