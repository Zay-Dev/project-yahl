id: group-manager-topics
description: Cluster knowledge topics into groups for cross-topic transfer scan

packages: [nodejs]

env:
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export

nixery:
  default: "true"
  tools: [nodejs]
  policies:
    - tools: [nodejs]
      mode: "true"

input:
  topics:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /data/mastermind:
    host: data/mastermind
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/knowledge-wiki:
    host: lib/knowledge-wiki
    mode: ro

run:
  entry: [node, /opt/nixery/def/run.mjs]

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
