id: merge-topic
description: Merge a sibling knowledge topic into a canonical (alias + retire source tree)

packages: [nodejs]

env:
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  SESSION_API_BASE_URL: ""

nixery:
  default: "true"
  tools: [nodejs]
  policies:
    - tools: [nodejs]
      mode: "true"

input:
  sourceTopic:
    type: string
    required: true
  targetTopic:
    type: string
    required: true
  dryRun:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /data/mastermind:
    host: data/mastermind
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
