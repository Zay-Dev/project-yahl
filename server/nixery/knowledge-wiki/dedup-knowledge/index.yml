id: dedup-knowledge
description: 3-phase knowledge dedup agent — plan/review thinking, execute flash

packages: [shell, gnugrep, nodejs]

env:
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_BASE_URL_PLAN: ""
  OPENAI_BASE_URL_EXECUTE: ""
  OPENAI_BASE_URL_REVIEW: ""
  OPENAI_PROVIDER_DOMAIN_PLAN: ""
  OPENAI_PROVIDER_DOMAIN_EXECUTE: ""
  OPENAI_PROVIDER_DOMAIN_REVIEW: ""
  OPENAI_MODEL_PLAN: deepseek-v4-pro
  OPENAI_MODEL_EXECUTE: deepseek-v4-flash
  OPENAI_MODEL_REVIEW: deepseek-v4-pro
  OPENAI_TEMPERATURE_PLAN: "0.3"
  OPENAI_TEMPERATURE_EXECUTE: "0.1"
  OPENAI_TEMPERATURE_REVIEW: "0.2"
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  MAX_EXECUTE_REVIEW_CYCLES: "3"

nixery:
  default: "true"
  tools: [shell, gnugrep, nodejs]
  policies:
    - tools: [shell, gnugrep, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: true
  purpose:
    type: string
    required: true
  scope:
    type: string
    required: false
  dryRun:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
