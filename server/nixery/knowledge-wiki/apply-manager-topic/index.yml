id: apply-manager-topic
description: Hone + ApplyPlan + apply + consume for a single knowledge topic

packages: [nodejs]

env:
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_TEMPERATURE: "0.2"
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  SESSION_API_BASE_URL: ""

nixery:
  default: "true"
  tools: [nodejs]
  policies:
    - tools: [nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: true
  dryRun:
    type: string
    required: false
  skipLlmPlan:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: rw
  /data/mastermind:
    host: data/mastermind
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
