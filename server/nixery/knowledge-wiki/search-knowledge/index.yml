id: search-knowledge
description: Search wiki export mirror by query string

packages: [shell, gnugrep, nodejs]

env:
  OPENAI_BASE_URL: ""
  OPENAI_MODEL: deepseek-v4-pro
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, gnugrep, nodejs]
  policies:
    - tools: [shell, gnugrep, nodejs]
      mode: "true"

input:
  query:
    type: string
    required: true
  topic:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: output.md
  validate: validation.mjs
  inlineTool: false
