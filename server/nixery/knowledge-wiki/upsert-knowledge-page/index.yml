id: upsert-knowledge-page
description: Deterministic knowledge corpus upsert — no LLM

packages: [nodejs]

env:
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: false
  topicText:
    type: string
    required: false
  key:
    type: string
    required: false
  value:
    type: string
    required: false
  page:
    type: string
    required: false
  section:
    type: string
    required: false
  content:
    type: string
    required: false
  mode:
    type: string
    required: false
  title:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: rw
  /data/mastermind:
    host: data/mastermind
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
