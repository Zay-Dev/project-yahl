id: apply-approved-transfers
description: Apply human-approved knowledge_transfer proposals into target topics

packages: [nodejs]

env:
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
  SESSION_API_BASE_URL: ""

nixery:
  default: "true"
  tools: [nodejs]
  policies:
    - tools: [nodejs]
      mode: "true"

input:
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: rw
  /data/mastermind:
    host: data/mastermind
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
