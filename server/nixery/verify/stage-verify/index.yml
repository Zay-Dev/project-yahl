id: stage-verify
description: Score YAHL stage context against a rubric via OpenAI — orchestrator verify gate

packages: [nodejs]

env:
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  contextSnapshot:
    type: string
    required: true
  minScore:
    type: string
    required: false
  requestId:
    type: string
    required: false
  rubric:
    type: string
    required: false
  stageIndex:
    type: string
    required: false
  stageSnapshot:
    type: string
    required: false
  verifyResume:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /data/verify:
    host: data/mastermind/rules/verify
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
