id: upsert-whatsapp-page
description: Upsert a knowledge page under whatsapp/{chatFolder}/ (not topics/)

packages: [nodejs]

env:
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  chatFolder:
    type: string
    required: true
  page:
    type: string
    required: true
  content:
    type: string
    required: true
  mode:
    type: string
    required: false
  title:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: false
