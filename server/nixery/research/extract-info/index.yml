id: extract-info
description: Workspace-file RAG — structured extraction from session files

packages: [nodejs]

env:
  OPENAI_BASE_URL: ""
  OPENAI_MODEL: deepseek-v4-pro
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  source:
    type: string
    required: true
  need:
    type: string
    required: false
  purpose:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /session:
    host: session-root
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
