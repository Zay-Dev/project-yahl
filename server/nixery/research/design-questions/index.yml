id: design-questions
description: Design ask-user batches from stage goals, knowledge gaps, and prior Q&A

packages: [nodejs]

env:
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  stage:
    type: string
    required: false
  stageIndex:
    type: string
    required: false
  gaps:
    type: string
    required: false
  priorQa:
    type: string
    required: false
  goal:
    type: string
    required: false
  mission:
    type: string
    required: false
  subjectContext:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
