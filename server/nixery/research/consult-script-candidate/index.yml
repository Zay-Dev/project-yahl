id: consult-script-candidate
description: LLM consultant — advise next ~/data/scripts op (prefer js+yahl-browser) and draft KTS notesHint

packages: [nodejs]

env:
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  existingScripts:
    type: string
    required: false
  pain:
    type: string
    required: false
  need:
    type: string
    required: false
  mission:
    type: string
    required: false
  stageHint:
    type: string
    required: false
  stageBrief:
    type: string
    required: false
  plan:
    type: string
    required: false
  guidelinePath:
    type: string
    required: false
  source:
    type: string
    required: false
  taskId:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /session:
    host: session-root
    mode: ro
  /tasks:
    host: data/workspace/tasks
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
