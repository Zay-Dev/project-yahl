id: research
description: Study workspace sources and synthesize research markdown

packages: [nodejs]

env:
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: false
  direction:
    type: string
    required: false
  url:
    type: string
    required: false
  source:
    type: string
    required: false
  mission:
    type: string
    required: false
  guidelinePath:
    type: string
    required: false
  facts:
    type: string
    required: false
  need:
    type: string
    required: false
  output:
    type: string
    required: false
  outputPath:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /session:
    host: session-root
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
