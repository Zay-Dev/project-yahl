id: consult-breaking-change
description: Deterministic agree/disagree gate before breaking stage procedure changes — no LLM

packages: [nodejs]

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  proposedChange:
    type: string
    required: true
  reason:
    type: string
    required: true
  context:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /opt/nixery/plugin:
    host: plugin
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
