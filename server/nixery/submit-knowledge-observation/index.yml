id: submit-knowledge-observation
description: Append a validated observation note under topics/{slug}/raw/observations — no mode/section merge

packages: [nodejs]

env:
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""
  TOPICS_REGISTRY_PATH: /data/mastermind/topics.json
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: false
  topic_hint:
    type: string
    required: false
  cue:
    type: string
    required: false
  claim:
    type: string
    required: false
  example:
    type: string
    required: false
  quote:
    type: string
    required: false
  evidence:
    type: string
    required: false
  confidence:
    type: string
    required: false
  tags:
    type: string
    required: false
  observation:
    type: string
    required: false
  sessionId:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /data/mastermind:
    host: data/mastermind
    mode: rw
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/knowledge-wiki:
    host: lib/knowledge-wiki
    mode: ro

run:
  entry: [node, /opt/nixery/def/run.mjs]

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
