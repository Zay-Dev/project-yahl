id: plan-study
description: Standalone knowledge study planner — study_plan JSON + wiki_structure from export corpus review

packages: [shell, gnugrep, nodejs]

env:
  OPENAI_BASE_URL: ""
  LLM_PROXY_TOKEN: ""
  OPENAI_PROVIDER_DOMAIN: ""
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_API_KEY: ""
  LLM_CALL_RETRY_MAX: ""
  OPENAI_TEMPERATURE: "0.2"
  OPENAI_MAX_TOKENS: "8192"

nixery:
  default: "true"
  tools: [shell, gnugrep, nodejs]
  policies:
    - tools: [shell, gnugrep, nodejs]
      mode: "true"

input:
  topic:
    type: string
    required: true
  purpose:
    type: string
    required: true
  goal:
    type: string
    required: false
  mission:
    type: string
    required: false
  learning_contract:
    type: string
    required: false
  corpus_assessment:
    type: string
    required: false
  todo_pickup:
    type: string
    required: false
  today:
    type: string
    required: false
  guideline:
    type: string
    required: false
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: plan.json
  validate: validation.mjs
  inlineTool: false
