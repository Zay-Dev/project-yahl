id: get-greets-page
description: Read a Wiki.js page under greets/{entity}/ into the session workspace

packages: [nodejs]

env:
  WIKI_GRAPHQL_URL: ""
  WIKI_API_TOKEN: ""

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  entity:
    type: string
    required: true
  page:
    type: string
    required: true
  output:
    type: string
    required: false

mount:
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/knowledge-wiki:
    host: lib/knowledge-wiki
    mode: ro

run:
  entry: [node, /opt/nixery/def/run.mjs]

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
