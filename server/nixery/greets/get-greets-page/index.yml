id: get-greets-page
description: Read a knowledge page under greets/{entity}/ into the session workspace

packages: [nodejs]

env:
  KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export

nixery:
  default: "true"
  tools: [shell, nodejs]
  policies:
    - tools: [shell, nodejs]
      mode: "true"

input:
  entity:
    type: string
    required: true
  page:
    type: string
    required: true
  output:
    type: string
    required: false

mount:
  /data/knowledge_export:
    host: data/knowledge_export
    mode: ro
  /workspace:
    host: session
    mode: rw
  /opt/nixery/def:
    host: def
    mode: ro
  /opt/nixery/plugin:
    host: plugin
    mode: ro

run:
  runtime: node
  entry: run.mjs

output:
  default: result.json
  validate: validation.mjs
  inlineTool: true
