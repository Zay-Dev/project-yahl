name: test the syntax
description: Testing
resultContextKey: result

stages:
  - contextMode: true
    produceContextKeys: [a, b, c]
    logic: |
      const base = { a: 1, b: 2 };

      (() => ({
        ...base,
        c: base.a + base.b,
        d: 1234
      }))

  - contextMode: true
    contextKeys: [c]
    updateContextKeys: [c]
    loopSetup: for each i of [1..5]
    logic: |
      (() => ({
        c: context.context.c + context.context.i,
      }));

  - id: step_loop
    temperature: 0.2
    loopSetup: for each i of [1..5,+2]
    contextKeys: [c]
    updateContextKeys: [c]
    logic: |
      c += i;

  - temperature: 0
    contextKeys: [c]
    goto:
      - command: '/stage(step_loop)'
        description: 'when c is less than 30 — re-run the stepped loop then continue'
    logic: |
      IF: c < 30;
        /stage(step_loop);
      END:

  - conditionMode: true
    contextKeys: [c]
    updateContextKeys: [c]
    logic: |
      IF: context.context.c % 2 === 0;
        (() => ({ c: context.context.c * 2 }));
      ELSE IF: context.context.c > 30;
        (() => ({ c: context.context.c - 2 }));
      ELSE:
        (() => ({ c: context.context.c / 2 }));
      END:

  - contextKeys: [c]
    updateContextKeys: [c]
    askUser:
      - id: 1
        question: which number of 1,2,3,4,5
    logic: |
      c += /ask-user(1);

  - temperature: 0.5
    contextKeys: [a, b, c]
    produceContextKeys: [result]
    logic: |
      const result = {a,b,c};

  - contextKeys: [c]
    updateContextKeys: [c]
    warmUp: |
      c += 1;
    whileSetup: context.context.c < 20
    maxTurns: 8
    logic: |
      c += 1;

  - contextMode: true
    updateContextKeys: [result]
    logic: |
      (() => ({ result: context.context.result }));