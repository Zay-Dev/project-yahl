services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  onecli:
    image: ghcr.io/onecli/onecli:latest
    depends_on:
      onecli_postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      DATABASE_URL: postgresql://onecli:onecli@onecli_postgres:5432/onecli
    ports:
      - "10254:10254"
      - "10255:10255"
    volumes:
      - ./data/onecli:/app/data

  onecli_postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      POSTGRES_DB: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_USER: onecli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli -d onecli"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - ./data/onecli_postgres:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/server/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HOST_REPO_ROOT: ${HOST_REPO_ROOT}
      MASTERMIND_API_URL: http://mastermind:4100
      MASTERMIND_INTERNAL_TOKEN: ${MASTERMIND_INTERNAL_TOKEN:-}
      MONGODB_URI: mongodb://mongo:27017/yahl
      OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
      OMNIFLEX_BUILD_CONTEXT: /omniflex
      ONECLI_DASHBOARD_URL: http://onecli:10254
      REDIS_URL: redis://redis:6379
      RUNTIME_REPO_ROOT: /omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/runtime
      RUNTIME_SHARED_NETWORK: ${SHARED_DOCKER_NETWORK:-yahl_shared}
      SESSION_API_BASE_URL: http://server:4000
      WORKSPACE_ROOT: /workspace
    ports:
      - "${SERVER_PORT:-4000}:4000"
    depends_on:
      - mongo
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/__/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./.env:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/.env:ro
      - ./runtime/.onecli:${HOST_REPO_ROOT}/runtime/.onecli
      - ./data/workspace:/workspace
      - ./server/tasks:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/server/tasks
      - ./server/nixery:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/server/nixery
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/web/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
        VITE_API_BASE_URL: http://localhost:${SERVER_PORT:-4000}
        VITE_WIKI_PUBLIC_URL: http://127.0.0.1:${WIKI_PORT:-3001}
    ports:
      - "5173:80"
    depends_on:
      - server

  mastermind:
    container_name: mastermind
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/mastermind/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      MASTERMIND_DATA_ROOT: /data
      MASTERMIND_INTERNAL_TOKEN: ${MASTERMIND_INTERNAL_TOKEN:-}
      MASTERMIND_PORT: "4100"
      SESSION_API_BASE_URL: http://server:4000
      WIKI_GRAPHQL_URL: http://wiki:3000/graphql
      WIKI_API_TOKEN: ${WIKI_API_TOKEN:-}
      KNOWLEDGE_EXPORT_ROOT: /data/knowledge_export
      WORKSPACE_ROOT: /workspace
    ports:
      - "4100:4100"
    volumes:
      - ./data/workspace:/workspace
      - ./data/mastermind:/data
      - ./data/knowledge_export:/data/knowledge_export:ro
      - ./mastermind/skills:/opt/mastermind-skills:ro
    depends_on:
      server:
        condition: service_healthy
      wiki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/worker/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      SESSION_API_BASE_URL: http://server:4000
      WORKER_BATCH_RUNS_ROOT: /tmp/yahl-batch-runs
      WORKER_POLL_INTERVAL_MS: "5000"
      WORKSPACE_ROOT: /workspace
    volumes:
      - ./data/workspace:/workspace
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wiki_postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      POSTGRES_DB: wiki
      POSTGRES_PASSWORD: ${WIKI_DB_PASSWORD:-wikijs}
      POSTGRES_USER: wikijs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikijs -d wiki"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/wiki_postgres:/var/lib/postgresql/data

  wiki:
    image: ghcr.io/requarks/wiki:2
    depends_on:
      wiki_postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      DB_TYPE: postgres
      DB_HOST: wiki_postgres
      DB_PORT: "5432"
      DB_USER: wikijs
      DB_PASS: ${WIKI_DB_PASSWORD:-wikijs}
      DB_NAME: wiki
    ports:
      - "127.0.0.1:${WIKI_PORT:-3001}:3000"
    volumes:
      - ./data/wiki:/wiki/data
      - ./data/knowledge_export:/wiki/data/repo

networks:
  default:
    name: ${SHARED_DOCKER_NETWORK:-yahl_shared}
