services:
  mongo:
    image: mongo:7
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
    ports:
      - "27017:27017"
    volumes:
      - ./data/mongo:/data/db

  redis:
    image: redis:7-alpine
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  onecli:
    image: ghcr.io/onecli/onecli:latest
    depends_on:
      onecli_postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      DATABASE_URL: postgresql://onecli:onecli@onecli_postgres:5432/onecli
    ports:
      - "10254:10254"
      - "10255:10255"
    volumes:
      - ./data/onecli:/app/data

  onecli_postgres:
    image: postgres:16-alpine
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      POSTGRES_DB: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_USER: onecli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli -d onecli"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - ./data/onecli_postgres:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/server/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      HOST_REPO_ROOT: ${HOST_REPO_ROOT}
      KNOWLEDGE_DATA_ROOT: /data/mastermind
      MONGODB_URI: mongodb://mongo:27017/yahl
      OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
      OMNIFLEX_BUILD_CONTEXT: /omniflex
      ONECLI_DASHBOARD_URL: http://onecli:10254
      PLATFORM_APPROVAL_TOKEN: ${PLATFORM_APPROVAL_TOKEN:-}
      REDIS_URL: redis://redis:6379
      RUNTIME_REPO_ROOT: /omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/runtime
      RUNTIME_SHARED_NETWORK: ${SHARED_DOCKER_NETWORK:-yahl_shared}
      SESSION_API_BASE_URL: http://server:4000
      WORKSPACE_ROOT: /workspace
      EMAIL_WHITELIST: ${EMAIL_WHITELIST:-}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WHITELIST: ${WHATSAPP_WHITELIST:-}
      YAHL_NIXERY_INLINE_RETRY_MAX: ${YAHL_NIXERY_INLINE_RETRY_MAX:-1}
    ports:
      - "${SERVER_PORT:-4000}:4000"
    depends_on:
      - mongo
      - redis
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:4000/__/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - ./.env:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/.env:ro
      - ./.env.nixery:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/.env.nixery:ro
      - ./runtime/.onecli:${HOST_REPO_ROOT}/runtime/.onecli
      - ./data/workspace:/workspace
      - ./data/mastermind:/data/mastermind
      - ./server/tasks:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/server/tasks
      - ./server/nixery:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/server/nixery
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/web/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
        VITE_CODE_SERVER_PUBLIC_URL: http://127.0.0.1:${CODE_SERVER_PORT:-8080}
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
    ports:
      - "5173:80"
    depends_on:
      - server

  llm-proxy:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/llm-proxy/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      LLM_API_KEY: ""
      LLM_CALL_RETRY_MAX: ${LLM_CALL_RETRY_MAX:-3}
      LLM_PROXY_PORT: "4100"
      LLM_PROXY_TOKEN: ${LLM_PROXY_TOKEN:-}
      NODE_EXTRA_CA_CERTS: /onecli/combined-ca.pem
      NODE_USE_ENV_PROXY: "1"
      NO_PROXY: localhost,127.0.0.1,::1,redis,server,mongo,onecli,worker,llm-proxy,host.docker.internal
      SESSION_API_BASE_URL: http://server:4000
      SSL_CERT_FILE: /onecli/combined-ca.pem
      DENO_CERT: /onecli/combined-ca.pem
      ONECLI_DASHBOARD_URL: http://onecli:10254
      no_proxy: localhost,127.0.0.1,::1,redis,server,mongo,onecli,worker,llm-proxy,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${LLM_PROXY_PORT:-4100}:4100"
    depends_on:
      server:
        condition: service_healthy
      onecli:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./llm-proxy:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/llm-proxy
      - ./runtime/.onecli:/onecli:ro

  worker:
    build:
      context: ..
      dockerfile: ${OMNIFLEX_APP_DIR:-project-yahl}/worker/Dockerfile
      args:
        OMNIFLEX_APP_DIR: ${OMNIFLEX_APP_DIR:-project-yahl}
    env_file:
      - .env
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
      SESSION_API_BASE_URL: http://server:4000
      WORKER_POLL_INTERVAL_MS: "5000"
      WORKER_HEALTH_PORT: "4091"
      WORKER_WHATSAPP_SEND_TIMEOUT_MS: "45000"
      WORKSPACE_ROOT: /workspace
      WHATSAPP_AUTH_PATH: /whatsapp/auth
      WHATSAPP_INBOX_ROOT: /whatsapp/inbox
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
      WHATSAPP_WHITELIST: ${WHATSAPP_WHITELIST:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SYSTEM_ADMIN_EMAIL: ${SYSTEM_ADMIN_EMAIL:-}
    volumes:
      - ./data/workspace:/workspace
      - ./data/whatsapp_auth:/whatsapp/auth
      - ./data/whatsapp_inbox:/whatsapp/inbox
      - ./worker:/omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/worker
      - /omniflex/${OMNIFLEX_APP_DIR:-project-yahl}/worker/node_modules
      - ${SANITIZE_CHANNEL_MESSAGE:-./worker/sanitize-channel-message.mjs}:/sanitize/sanitize-channel-message.mjs:ro
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  code-server:
    image: codercom/code-server:4.104.2
    environment:
      TZ: ${TZ:-Asia/Hong_Kong}
    command:
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - none
      - --disable-telemetry
      - --disable-update-check
      - /home/coder/yahl
    ports:
      - "127.0.0.1:${CODE_SERVER_PORT:-8080}:8080"
    volumes:
      - ./data/knowledge_export:/home/coder/yahl/data/knowledge_export:rw
      - ./data/workspace/sessions:/home/coder/yahl/data/workspace/sessions:ro
      - ./data/workspace/tasks:/home/coder/yahl/data/workspace/tasks:rw
      - ./runtime/orchestrator/SKILLS:/home/coder/yahl/runtime/orchestrator/SKILLS:rw
      - ./runtime/orchestrator/YAHL:/home/coder/yahl/runtime/orchestrator/YAHL:rw
      - ./server/tasks:/home/coder/yahl/server/tasks:rw
      - ./server/nixery:/home/coder/yahl/server/nixery:rw

networks:
  default:
    name: ${SHARED_DOCKER_NETWORK:-yahl_shared}
