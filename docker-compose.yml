services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 10

  onecli:
    image: ghcr.io/onecli/onecli:latest
    depends_on:
      onecli_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://onecli:onecli@onecli_postgres:5432/onecli
    ports:
      - "10254:10254"
      - "10255:10255"
    volumes:
      - onecli_data:/app/data

  onecli_postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_USER: onecli
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli -d onecli"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - onecli_postgres_data:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    working_dir: /omniflex
    command: sh -lc "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter @project-yahl/runtime install --config.confirmModulesPurge=false && pnpm -r --filter \"./infras/**\" run build && pnpm --filter @project-yahl/server run dev"
    env_file:
      - .env
    environment:
      CI: "true"
      MONGODB_URI: mongodb://mongo:27017/yahl
      REDIS_URL: redis://redis:6379
      HOST_REPO_ROOT: ${HOST_REPO_ROOT}
      OMNIFLEX_BUILD_CONTEXT: /omniflex
      RUNTIME_REPO_ROOT: /omniflex/project-yahl
      SESSION_API_BASE_URL: http://127.0.0.1:4000
      RUNTIME_SHARED_NETWORK: yahl_shared
      YAHL_ENABLE_ASK_USER: ${YAHL_ENABLE_ASK_USER:-false}
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    ports:
      - "4000:4000"
    depends_on:
      - mongo
      - redis
    volumes:
      - ../:/omniflex
      - ${HOST_REPO_ROOT}:${HOST_REPO_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock
      - omniflex_node_modules:/omniflex/node_modules
      - omniflex_pnpm_store:/omniflex/.pnpm-store
      - yahl_server_node_modules:/omniflex/project-yahl/server/node_modules
      - yahl_server_node_modules:${HOST_REPO_ROOT}/server/node_modules
      - yahl_runtime_node_modules:/omniflex/project-yahl/runtime/node_modules
      - yahl_runtime_node_modules:${HOST_REPO_ROOT}/runtime/node_modules
      - infras_core_node_modules:/omniflex/infras/core/node_modules
      - infras_express_node_modules:/omniflex/infras/express/node_modules
      - infras_ioredis_node_modules:/omniflex/infras/ioredis/node_modules
      - infras_mongoose_node_modules:/omniflex/infras/databases/mongoose/node_modules
      - infras_logger_winston_node_modules:/omniflex/infras/loggers/logger-winston/node_modules
      - infras_aws_kms_node_modules:/omniflex/infras/modules/aws-kms-client/node_modules

  web:
    image: node:22
    working_dir: /app
    command: sh -lc "corepack enable && pnpm install --config.confirmModulesPurge=false && pnpm --filter web dev --host 0.0.0.0 --port 5173"
    env_file:
      - .env
    environment:
      CI: "true"
    depends_on:
      - server
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules

volumes:
  onecli_data:
  onecli_postgres_data:
  web_node_modules:
  omniflex_node_modules:
  omniflex_pnpm_store:
  yahl_server_node_modules:
  yahl_runtime_node_modules:
  infras_core_node_modules:
  infras_express_node_modules:
  infras_ioredis_node_modules:
  infras_mongoose_node_modules:
  infras_logger_winston_node_modules:
  infras_aws_kms_node_modules:

networks:
  default:
    name: yahl_shared